# Conventional commits, kontrolleras av `committed` i commit-msg-hooken och i CI.
style = "conventional"
subject_length = 72
subject_capitalized = false
subject_not_punctuated = true
imperative_subject = true
line_length = 100
merge_commit = false
no_fixup = true
no_wip = true
allowed_types = [
  "feat",
  "fix",
  "docs",
  "style",
  "refactor",
  "perf",
  "test",
  "build",
  "ci",
  "chore",
  "revert",
]
