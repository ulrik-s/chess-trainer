<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schacktränaren</title>
    <link rel="icon" href="data:," />
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      :root {
        --bg: #f6f4ef;
        --fg: #1d1d1b;
        --muted: #6b6a66;
        --card: #ffffff;
        --light: #e3e6ea;
        --dark: #9aa5b4;
        --sel: #f6f669;
        --accent: #3b6e2a;
        --warn: #9a3b1b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171716;
          --fg: #ecebe6;
          --muted: #a3a29c;
          --card: #22221f;
          --light: #c4c9d0;
          --dark: #75818f;
          --sel: #c8c84a;
          --accent: #8cc56f;
          --warn: #f08a62;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 520px;
        margin: 0 auto;
        display: grid;
        gap: 16px;
      }
      .play,
      .controls,
      .side {
        display: grid;
        gap: 16px;
        align-content: start;
        min-width: 0;
      }
      /* På bred skärm: brädet till vänster, texterna bredvid, allt synligt utan att scrolla. */
      @media (min-width: 900px) {
        main {
          max-width: 1200px;
          height: calc(100vh - 32px);
          grid-template-columns: minmax(360px, min(620px, calc(100vh - 190px))) minmax(320px, 1fr);
          grid-template-rows: auto minmax(0, 1fr);
          align-items: start;
        }
        .play {
          grid-column: 1;
          grid-row: 1 / span 2;
        }
        .controls {
          grid-column: 2;
          grid-row: 1;
        }
        /* Högerkolumnen scrollar själv om texterna blir långa; sidan scrollar aldrig. */
        .side {
          grid-column: 2;
          grid-row: 2;
          max-height: 100%;
          overflow-y: auto;
        }
      }
      h1 {
        font-size: 1.4rem;
        margin: 0;
      }
      #status {
        margin: 0;
        font-weight: 600;
      }
      #board {
        display: grid;
        /* minmax(0, 1fr): kolumnerna får inte växa efter innehållet, annars blir rutorna olika stora i iOS. */
        grid-template-columns: repeat(8, minmax(0, 1fr));
        grid-template-rows: repeat(8, minmax(0, 1fr));
        width: 100%;
        aspect-ratio: 1;
        border-radius: 6px;
        overflow: hidden;
        user-select: none;
      }
      .sq {
        -webkit-appearance: none;
        appearance: none;
        border: 0;
        border-radius: 0;
        padding: 0;
        margin: 0;
        min-width: 0;
        min-height: 0;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
        font-size: min(9vw, 46px);
        line-height: 1;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .sq:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: -3px;
      }
      .light {
        background: var(--light);
      }
      .dark {
        background: var(--dark);
      }
      .sel {
        background: var(--sel);
      }
      /* Attackfärgning: en inre skugga tonar rutan men låter rutfärg och markering synas. */
      .heat-danger-1 {
        box-shadow: inset 0 0 0 100px rgba(214, 39, 40, 0.3);
      }
      .heat-danger-2 {
        box-shadow: inset 0 0 0 100px rgba(214, 39, 40, 0.48);
      }
      .heat-danger-3 {
        box-shadow: inset 0 0 0 100px rgba(214, 39, 40, 0.65);
      }
      .heat-safe-1 {
        box-shadow: inset 0 0 0 100px rgba(31, 150, 70, 0.16);
      }
      .heat-safe-2 {
        box-shadow: inset 0 0 0 100px rgba(31, 150, 70, 0.28);
      }
      .heat-safe-3 {
        box-shadow: inset 0 0 0 100px rgba(31, 150, 70, 0.4);
      }
      .heat-even {
        box-shadow: inset 0 0 0 100px rgba(235, 180, 20, 0.4);
      }
      .heat-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 16px;
        margin-top: -8px;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
      }
      .item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }
      .swatch {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: var(--light);
      }
      .pc {
        font-family: "Apple Symbols", "Segoe UI Symbol", "DejaVu Sans", sans-serif;
        /* Pjäsen fyller rutan, så att glidningen kan räknas i hela rutor. */
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      /* Tips: pjäsen som bör flyttas blir blå, och målrutan får en blå ring. */
      .hint-from .pc.w,
      .hint-from .pc.b {
        color: #1f6feb;
        text-shadow: 0 0 2px #fff, 0 0 1px #fff;
      }
      .hint-to {
        position: relative;
      }
      .hint-to::after {
        content: "";
        position: absolute;
        inset: 8%;
        border: 4px solid rgba(31, 111, 235, 0.9);
        border-radius: 50%;
        pointer-events: none;
      }
      .last {
        outline: 3px solid rgba(255, 196, 0, 0.9);
        outline-offset: -3px;
      }
      .slide {
        position: relative;
        z-index: 1;
        animation: slide 450ms ease-in-out;
      }
      @keyframes slide {
        from {
          transform: translate(calc(var(--dx) * 100%), calc(var(--dy) * 100%));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .slide {
          animation: none;
        }
      }
      .pc.w {
        color: #fff;
        text-shadow: 0 0 2px #000, 0 0 1px #000;
      }
      .pc.b {
        color: #111;
      }
      form,
      .buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      input {
        flex: 1;
        min-width: 0;
        font: inherit;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid var(--muted);
        background: var(--card);
        color: var(--fg);
      }
      button.action {
        font: inherit;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid var(--muted);
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
      }
      section {
        background: var(--card);
        border-radius: 8px;
        padding: 12px 14px;
      }
      h2 {
        font-size: 1rem;
        margin: 0 0 6px;
      }
      #thinking {
        margin: 0;
      }
      #moves,
      #log {
        white-space: pre-line;
        margin: 0;
        color: var(--muted);
      }
      #log {
        color: var(--fg);
      }
      #lessons {
        margin: 0;
        padding-left: 20px;
      }
      #rating-chart {
        color: var(--accent);
      }
      #rating-chart svg {
        width: 100%;
        height: 80px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="play">
      <h1>Schacktränaren</h1>
      <p id="status" aria-live="polite">Laddar…</p>
      <div id="board" role="grid" aria-label="Schackbräde"></div>
      <div class="heat-bar">
        <label class="toggle"><input type="checkbox" id="show-heat" checked /> Visa attacker</label>
        <p class="legend">
          <span class="item"><span class="swatch heat-danger-2"></span>Motståndaren attackerar mer</span>
          <span class="item"><span class="swatch heat-even"></span>Lika</span>
          <span class="item"><span class="swatch heat-safe-2"></span>Du har övertaget</span>
        </p>
      </div>
      </div>
      <div class="controls">
      <form id="move-form">
        <input
          id="move-input"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Ditt drag, t.ex. e4 eller springare f3"
          aria-label="Ditt drag"
        />
        <button class="action primary" type="submit">Spela</button>
      </form>
      <div class="buttons">
        <button class="action" id="hint" type="button">Tips</button>
        <button class="action" id="undo" type="button">Ångra drag</button>
        <button class="action" id="new-white" type="button">Nytt parti som vit</button>
        <button class="action" id="new-black" type="button">Nytt parti som svart</button>
        <button class="action" id="describe" type="button">Beskriv ställningen</button>
        <button class="action" id="resign" type="button">Ge upp</button>
      </div>
      </div>
      <aside class="side">
      <section>
        <h2>Motorn tänker</h2>
        <p id="thinking" aria-live="polite"></p>
      </section>
      <section>
        <h2>Händelser</h2>
        <p id="log" aria-live="polite"></p>
      </section>
      <section>
        <h2>Drag</h2>
        <p id="moves"></p>
      </section>
      <section>
        <h2 id="rating">Uppskattad rating</h2>
        <div id="rating-chart"></div>
      </section>
      <section>
        <h2>Lärdomar</h2>
        <ul id="lessons"></ul>
      </section>
      </aside>
    </main>
  </body>
</html>
